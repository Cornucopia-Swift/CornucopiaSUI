name: CornucopiaSUIDemo
options:
  bundleIdPrefix: de.vanille.cornucopia
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CornucopiaSUI:
    path: ..
targets:
  CornucopiaSUIDemo:
    type: application
    platform: iOS
    sources:
      - CornucopiaSUIDemo
    dependencies:
      - package: CornucopiaSUI
        product: CornucopiaSUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.vanille.cornucopia.CornucopiaSUIDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "CornucopiaSUI demo uses photo picking to demonstrate ImagePickerView."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "CornucopiaSUI demo checks local network authorization for diagnostic app scenarios."
        INFOPLIST_KEY_NSLBonjourServices:
          - "_lnp._tcp"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
