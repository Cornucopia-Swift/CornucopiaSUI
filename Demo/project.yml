name: InputMethodsDemo
options:
  bundleIdPrefix: de.vanille.cornucopia
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CornucopiaSUI:
    path: ..
targets:
  InputMethodsDemo:
    type: application
    platform: iOS
    sources:
      - InputMethodsDemo
    dependencies:
      - package: CornucopiaSUI
        product: CornucopiaSUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.vanille.cornucopia.InputMethodsDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
